[project]
name = "pm-system"
version = "0.1.0"
description = "E Noa Corporation's internal tickets, projects, and tasks app."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
# This is an application, not a library: run it from this folder, don't install it.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # likely bugs
    "UP",  # modern Python syntax
    "SIM", # simpler code
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
